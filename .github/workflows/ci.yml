# push/PR 门禁：与 release.yml 的门禁步保持一致（不发布）。
# 目的：main 的坏状态在 push 时就暴露，而不是等推 v* 标签才发现。
name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Enable pnpm (corepack, 版本钉在根 package.json packageManager)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test（真实临时 git 仓库集成测试）
        run: pnpm run test

      - name: Build（host typert 产物 + client bundle + git-bundle 一致性）
        run: pnpm run build

      # P3 门禁矩阵：npm latest 列——对已发布 dsh 形态（0.2.1-rc.5）做安装冒烟，
      # 此前门禁从未覆盖任何已发布 dsh。不设 DSH_VERIFY_ALLOW_SKIP ⇒ npm 形态安装
      # 失败 exit 2 按步失败处理。
      # 显式决策（报告 §2.6③ 与 CI 交互复核）：CI 设 DSH_VERIFY_INSTALL_SKIP_CLONE=1
      # 跳过干净 clone 相——clone 相会对本工作区再 clone + pnpm install --frozen-lockfile
      # + pnpm run build，CI 时长近乎翻倍；干净 clone 相保持本地发布门禁定位。
      - name: Verify install matrix（npm latest 列）
        run: node scripts/verify-install.mjs
        env:
          DSH_SPEC: '@deepseek-ai/dsh@0.2.1-rc.5'
          DSH_VERIFY_INSTALL_SKIP_CLONE: '1'
