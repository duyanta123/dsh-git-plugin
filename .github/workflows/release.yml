# tag 驱动的 npm 自动发布：推送 v* 标签 → 门禁 → 发布 dsh-gitkit + dsh-gitkit-ui
# workflow_dispatch：手动补发通道，经 fail-closed 锚定步锚定到发布 tag ——
#   host/client 清单版本必须相等，且 v<version> 必须存在并指向本次 checkout 的
#   GITHUB_SHA（不再「跳过 tag 校验，按 manifest 版本发布」——npm 0.1.1 与 tag v0.1.1
#   内容失配教训，报告 P4 第一层）。
# 前置：GitHub 仓库 Secrets 配置 NPM_TOKEN（npm automation token，需拥有 dsh-plugin scope/org）
# git-bundle 不走 npm（file: 相对依赖无法远程解析）——它保持 GitHub/本地分发通道（见 README §2）
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # P4 第一层：dispatch 锚定步要解析 tag → commit（git rev-parse v<version>^{commit}），
          # 默认 fetch-depth: 1 的 shallow checkout 拿不到 tag 对象。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Enable pnpm (corepack, 版本钉在根 package.json packageManager)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Assert tag == manifest version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # 注意：$host 是 PowerShell 只读自动变量，变量名必须避开（$tag/$client 同理谨慎）
          $tagVersion = ${env:GITHUB_REF_NAME} -replace '^v', ''
          $hostVersion = (Get-Content packages/host/package.json | ConvertFrom-Json).version
          $clientVersion = (Get-Content packages/client-ui/package.json | ConvertFrom-Json).version
          if ($tagVersion -ne $hostVersion -or $tagVersion -ne $clientVersion) {
            throw "tag v$tagVersion 与清单版本不一致：host=$hostVersion client=$clientVersion（应同升四个 manifest 后再打 tag）"
          }

      # P4 第一层（fail-closed）：dispatch 补发必须锚定到已打 tag 的发布——0.1.1 案例
      # （tag v0.1.1=e2ac0e6 ≠ 发布 HEAD=266d1cf）在此步即被拒。
      - name: Assert dispatch is anchored to the tagged release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          # 注意：$host 是 PowerShell 只读自动变量，变量名必须避开（$tag/$client 同理谨慎）
          $hostVersion = (Get-Content packages/host/package.json | ConvertFrom-Json).version
          $clientVersion = (Get-Content packages/client-ui/package.json | ConvertFrom-Json).version
          if ($hostVersion -ne $clientVersion) {
            throw "清单版本不一致：host=$hostVersion client=$clientVersion（应同升四个 manifest 后再补发）"
          }
          $tag = "v$hostVersion"
          $tagCommit = git rev-parse "$tag^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrEmpty($tagCommit)) {
            throw "dispatch 补发被拒绝（fail-closed）：tag $tag 不存在——补发必须锚定到已打 tag 的发布内容"
          }
          if ($tagCommit -ne ${env:GITHUB_SHA}) {
            throw "dispatch 补发被拒绝（fail-closed）：tag $tag 指向 $tagCommit，而本次 checkout 是 ${env:GITHUB_SHA}——内容已在 tag 之后变更（v0.1.1 失配教训）"
          }

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test（真实临时 git 仓库集成测试）
        run: pnpm run test

      - name: Build（host typert 产物 + client bundle + git-bundle 一致性）
        run: pnpm run build

      # P3 门禁矩阵：npm latest 列——npm publish 之前对已发布 dsh 形态（0.2.1-rc.5）
      # 做安装冒烟（此前发布前对发布形态零验证）。不设 DSH_VERIFY_ALLOW_SKIP ⇒ npm
      # 失败 exit 2 按步失败处理。DSH_VERIFY_INSTALL_SKIP_CLONE=1 的决策同 ci.yml
      # （干净 clone 相保持本地发布门禁定位，CI 时长不翻倍）。
      - name: Verify install matrix（npm latest 列）
        run: node scripts/verify-install.mjs
        env:
          DSH_SPEC: '@deepseek-ai/dsh@0.2.1-rc.5'
          DSH_VERIFY_INSTALL_SKIP_CLONE: '1'

      - name: Publish dsh-gitkit + dsh-gitkit-ui
        # 只发两个发布包：pnpm -r publish 会把 workspace 内所有非 private 包一起发，
        # 包括 vendored 的 @deepseek-ai/dsh-typert-protocol（不属于本仓库）。
        run: pnpm -r --filter dsh-gitkit --filter dsh-gitkit-ui publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # P4 第三层侦探：Publish 之后把 registry 上刚发布的 tarball 与本次 checkout 重打包
      # 逐字节比对（tag 通道 checkout 即 tag、dispatch 通道已被第一层锚定为同一 commit，
      # 故「当前 checkout 重打包」≡「tag 检出重打包」）。差异即 exit 1；断言红时人工
      # 比对差异清单，勿直接 rerun（rerun 会在 Publish 撞同版本重发拒绝）。
      - name: Verify published tarballs（registry vs 本地重打包逐字节比对）
        run: node scripts/verify-release-tarball.mjs
        env:
          # 与 Publish 步同凭据上下文（npm pack 从 registry 拉已发布 tarball）。
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
